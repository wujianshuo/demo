<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 中交四航局第三工程有限公司</title>
    <link rel="icon" href="./1_home_files/logo.png">
    <link rel="stylesheet" href="./1_home_files/main.css">
    <script src="./assets/site-data.js"></script>
    <script src="./assets/site-nav.js"></script>
    <style>        /* 2026-11-05：详情页并入全站统一体系——白面板直角无边框、大标题 28px + 通栏主色下划线（见 main.css）；
           本页只保留无侧边栏时的阅读宽度（正文净宽同为 1054px）与文章正文细节。 */

        .article-wrap {
            width: 1150px;
            max-width: 96%;
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        .article-card {
            background: var(--white);
            border: none;
            border-radius: 0;
            padding: 32px 48px;
            min-height: 480px;
            box-sizing: border-box;
        }

        .article-meta {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line-soft);
            margin-bottom: 24px;
        }

        /* 段间用一个全角空格分隔，与官网详情页 meta 行一致 */
        .article-meta span + span::before { content: '　'; margin: 0; }

        .article-cover {
            display: block;
            max-width: 100%;
            margin: 0 auto 24px;
        }

        .article-content {
            font-size: 16px;
            line-height: 2;
            color: var(--text);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .article-content p {
            margin: 0 0 16px;
        }

        .article-content ul {
            margin: 0 0 16px;
            padding-left: 24px;
        }

        .article-content li {
            list-style: none;
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 1.9;
            color: var(--text);
        }

        .article-content li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 14px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.65;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        .article-back {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 14px;
            cursor: pointer;
        }

        .article-back:hover {
            color: var(--primary-dark);
        }

        @media (max-width:768px) {
            .article-card {
                padding: 24px 20px;
            }
        }
        </style>
</head>

<body data-site="shj">

    <!-- 导航栏开始 -->
    <header class="header">
        <div class="header-top">
            <div class="header-nav">
                <a href="./1_home.html" class="logo">
        <img src="./1_home_files/logo.png" alt="中交四航局第三工程有限公司" onerror="this.style.display=&#39;none&#39;">
      </a>
                <button class="mobile-toggle">☰</button>
                <ul class="nav" id="main-nav"></ul>
            </div>
        </div>
    </header>
    <!-- 导航栏结束 -->

    <div class="article-wrap">
        <div class="article-card">
            <a class="article-back" onclick="history.back()">← 返回</a>
            <h1 id="article-title">加载中…</h1>
            <div class="article-meta">

            </div>
            <img class="article-cover" id="article-cover" alt="" style="display:none;">
            <div class="article-content" id="article-content"></div>
        </div>
    </div>

    <footer class="footer" style="background:var(--text);color:rgba(255,255,255,0.7);padding:32px 5% 24px;">
        <div style="margin:0 auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:13px;display:flex;justify-content:space-between;align-items:center;">
            <span>Copyright ©2026 中交第四航务工程局有限公司 版权所有 All Rights Reserved</span>
            <span>备案号:粤ICP备05060342号 | 粤公网安备44010502000178号</span>
        </div>
    </footer>

    <button class="back-top" aria-label="回到顶部">↑</button>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var aid = params.get('aid') || '';
            var articles = window.SITE_ARTICLES || [];
            var article = null;
            if (aid) {
                for (var i = 0; i < articles.length; i++) {
                    if (articles[i].hash_id === aid) {
                        article = articles[i];
                        break;
                    }
                }
                if (!article && /^\d+$/.test(aid)) {
                    var id = Number(aid);
                    for (var j = 0; j < articles.length; j++) {
                        if (articles[j].id === id) {
                            article = articles[j];
                            break;
                        }
                    }
                }
            }

            function buildContent(a) {
                if (a.content) return a.content;
                var out = '';
                if (a.summary) out += '<p>' + a.summary + '</p>';
                return out;
            }

            if (!article) {
                document.getElementById('article-title').textContent = '文章不存在或已下线';
            document.querySelector('.article-meta').style.display = 'none';
                document.getElementById('article-content').innerHTML = '<p style="color:#999;">抱歉，您访问的文章不存在或已下线，请返回列表查看其他内容。</p>';
                return;
            }

            document.title = article.title + ' - ' + (window.SITE_NAME || '中交四航局第三工程有限公司');
            document.getElementById('article-title').textContent = article.title;
            /* 详情页 meta：只显示本条真实存在的字段（日期 / 作者 / 来源 / 浏览），缺字段不编造占位 */
            var metaSegs = [];
            var metaDate = (article.published_at || article.created_at || '').substring(0, 10);
            if (metaDate) metaSegs.push('日期：' + metaDate);
            if (article.author) metaSegs.push('作者：' + article.author);
            if (article.source) metaSegs.push('来源：' + article.source);
            if (article.views) metaSegs.push('浏览：' + article.views);
            var metaEl = document.querySelector('.article-meta');
            if (metaSegs.length) {
                metaEl.innerHTML = metaSegs.map(function (s) { return '<span>' + s + '</span>'; }).join('');
            } else {
                metaEl.style.display = 'none';
            }
            var cover = document.getElementById('article-cover');
            if (article.cover_image) {
                cover.src = article.cover_image;
                cover.style.display = 'block';
            }
            document.getElementById('article-content').innerHTML = buildContent(article);
        })();
    </script>

    <script src="./assets/app.js"></script>

</body>

</html>
