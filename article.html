<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 中交四航局第三工程有限公司</title>
    <link rel="icon" href="./1_home_files/logo.png">
    <link rel="stylesheet" href="./1_home_files/main.css">
    <script src="./assets/site-data.js"></script>
    <script src="./assets/site-nav.js"></script>
    <style>
        body {
            background: #f5f6f8;
        }

        .article-wrap {
            width: 1000px;
            max-width: 96%;
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        .article-card {
            background: #fff;
            padding: 40px 48px;
            border: 1px solid #e8eef7;
        }

        .article-card h1 {
            font-size: 28px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 16px;
            text-align: center;
        }

        .article-meta {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 24px;
        }

        .article-meta span+span::before {
            content: '·';
            margin: 0 10px;
            color: #ccc;
        }

        .article-cover {
            display: block;
            max-width: 100%;
            margin: 0 auto 24px;
        }

        .article-content {
            font-size: 16px;
            line-height: 2;
            color: #333;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .article-content p {
            margin: 0 0 16px;
        }

        .article-content .sub-title {
            margin: 28px 0 12px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
            font-size: 17px;
            font-weight: 600;
            color: #222;
            line-height: 1.6;
        }

        .article-content ul {
            margin: 0 0 16px;
            padding: 0;
        }

        .article-content li {
            list-style: none;
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            font-size: 15px;
            line-height: 1.9;
            color: #444;
        }

        .article-content li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.65;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        .article-back {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .article-back:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .article-card {
                padding: 24px 20px;
            }
            .article-card h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body data-site="shj">

    <!-- 导航栏开始 -->
    <header class="header">
        <div class="header-top">
            <div class="header-nav">
                <a href="./1_home.html" class="logo">
        <img src="./1_home_files/logo.png" alt="中交四航局第三工程有限公司" onerror="this.style.display=&#39;none&#39;">
      </a>
                <button class="mobile-toggle">☰</button>
                <ul class="nav" id="main-nav"></ul>
            </div>
        </div>
    </header>
    <!-- 导航栏结束 -->

    <div class="article-wrap">
        <div class="article-card">
            <a class="article-back" onclick="history.back()">← 返回</a>
            <h1 id="article-title">加载中…</h1>
            <div class="article-meta">
                <span id="article-date"></span>
                <span id="article-source"></span>
            </div>
            <img class="article-cover" id="article-cover" alt="" style="display:none;">
            <div class="article-content" id="article-content"></div>
        </div>
    </div>

    <footer class="footer" style="background:var(--text);color:rgba(255,255,255,0.7);padding:32px 5% 24px;">
        <div style="margin:0 auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:13px;display:flex;justify-content:space-between;align-items:center;">
            <span>Copyright ©2026 中交第四航务工程局有限公司 版权所有 All Rights Reserved</span>
            <span>备案号:粤ICP备05060342号 | 粤公网安备44010502000178号</span>
        </div>
    </footer>

    <button class="back-top" aria-label="回到顶部">↑</button>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var aid = params.get('aid') || '';
            var articles = window.SITE_ARTICLES || [];
            var article = null;
            if (aid) {
                for (var i = 0; i < articles.length; i++) {
                    if (articles[i].hash_id === aid) {
                        article = articles[i];
                        break;
                    }
                }
                if (!article && /^\d+$/.test(aid)) {
                    var id = Number(aid);
                    for (var j = 0; j < articles.length; j++) {
                        if (articles[j].id === id) {
                            article = articles[j];
                            break;
                        }
                    }
                }
            }

            function buildContent(a) {
                if (a.content) return a.content;
                var out = '';
                if (a.summary) out += '<p>' + a.summary + '</p>';
                return out;
            }

            if (!article) {
                document.getElementById('article-title').textContent = '文章不存在或已下线';
                document.getElementById('article-content').innerHTML = '<p style="color:#999;">抱歉，您访问的文章不存在或已下线，请返回列表查看其他内容。</p>';
                return;
            }

            document.title = article.title + ' - 中交四航局第三工程有限公司';
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-date').textContent = (article.published_at || article.created_at || '').substring(0, 10);
            document.getElementById('article-source').textContent = '来源：' + (article.source || '本站') + (article.author ? '　作者：' + article.author : '');
            var cover = document.getElementById('article-cover');
            if (article.cover_image) {
                cover.src = article.cover_image;
                cover.style.display = 'block';
            }
            document.getElementById('article-content').innerHTML = buildContent(article);
        })();
    </script>

    <script src="./assets/app.js"></script>

</body>

</html>
